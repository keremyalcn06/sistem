name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Build Web
        run: npm run build

      - name: Create Android Web Folder
        run: |
          rm -rf android-webroot
          mkdir android-webroot
          cp -r .output/public/* android-webroot/
          touch android-webroot/index.html

      - name: Install Capacitor Android
        run: |
          npm install @capacitor/android
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SYSTEM-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
